server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    # nginx drops server-level add_header lines in any location that has its
    # own add_header, so every location below repeats these three, with
    # `always` so error responses (the 404 page) carry them too.

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # ── Real 404s ─────────────────────────────────────────────────────────────
    # Unknown paths get the prerendered not-found page with status 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ── Long-lived cache for hashed static assets ─────────────────────────────
    # Vite appends a content hash to JS/CSS filenames, so they can be
    # cached aggressively without ever serving stale content.
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
    }

    # ── Web app manifest ──────────────────────────────────────────────────────
    # A types block replaces the inherited MIME map for its context, so it is
    # scoped to this one file instead of the whole server.
    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ── OAuth popup landing page ──────────────────────────────────────────────
    # main.tsx handles it before React mounts; never index it.
    location = /oauth/callback {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files /spa.html =404;
    }

    # ── Signed-in app routes ──────────────────────────────────────────────────
    # The app shell (spa.html, robots noindex); React Router takes it from there.
    location ~ ^/(campaigns|create|scheduler|analytics|settings|login|register|oauth)(/|$) {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files /spa.html =404;
    }

    # ── Public pages and files ────────────────────────────────────────────────
    # Prerendered pages live at <path>/index.html (dist/index.html for "/"),
    # alongside robots.txt and sitemap.xml. Anything else is a real 404.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/index.html =404;
    }
}

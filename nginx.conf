server {
    listen 80;
add_header X-Content-Type-Options nosniff;
add_header X-Frame-Options DENY;
add_header Referrer-Policy strict-origin-when-cross-origin;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Long-lived cache for hashed static assets ─────────────────────────────
    # Vite appends a content hash to JS/CSS filenames, so they can be
    # cached aggressively without ever serving stale content.
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # All non-asset requests are served index.html so React Router can
    # handle client-side navigation for deep links and page refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

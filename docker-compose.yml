# AutoMarketer — development environment
#
# Usage:
#   cp .env.example .env          # configure credentials
#   docker compose up --build     # start all services
#   docker compose down           # stop and remove containers
#
# Requires Docker 24+ with Compose v2 (docker compose, not docker-compose)

name: automarketer

services:

  # ── React frontend dev server ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      # Mount project source for hot-module reload
      - .:/app
      # Isolate container node_modules from the host to avoid
      # platform/architecture conflicts (e.g. macOS vs Linux binaries)
      - node_modules:/app/node_modules
    environment:
      # Override Vite's HMR defaults (which target the cloud proxy on port 443)
      # so HMR connects correctly when accessing the app via localhost:5173
      - HMR_CLIENT_PORT=5173
      - HMR_PROTOCOL=ws
      # Database connection URL — consumed by the backend once it is wired up
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-automarketer}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - automarketer-net

  # ── PostgreSQL database ───────────────────────────────────────────────────
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      # Expose for local DB clients (psql, TablePlus, DBeaver, etc.)
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-automarketer}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-automarketer}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - automarketer-net

volumes:
  # Mounted at /var/lib/postgresql (not /data) so Postgres 18+ can place data
  # in its version-specific subdirectory (18/main) as required by the image.
  postgres_data:   # persists database data across container restarts
  node_modules:    # isolates container node_modules from host

networks:
  automarketer-net:
    driver: bridge
